<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智能浇水系统</title>
    <!-- 样式保持不变，此处省略 -->
</head>
<body>
    <div class="container">
        <!-- 界面结构与之前相同，省略以节省篇幅 -->
    </div>
    <script>
        // Service Worker 注册 (可选)
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/service-worker.js').catch(()=>{}); }

        // 页面加载时读取目标时刻
        (function() { const saved = localStorage.getItem('wateringTargetTime'); if (saved) document.getElementById('targetTime').value = saved; })();

        const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const CHAR_HUMIDITY_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
        const CHAR_COMMAND_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a9';
        let bleDevice, bleServer, humCharacteristic, cmdCharacteristic, connected = false;
        const connectBtn = document.getElementById('connectBtn'), bleStatusSpan = document.getElementById('bleStatus');

        function updateConnectionUI() {
            if (connected) { connectBtn.innerText = '🔌 断开连接'; connectBtn.className = 'btn-red'; bleStatusSpan.innerText = '已连接'; connectBtn.disabled = false; }
            else { connectBtn.innerText = '📶 连接设备'; connectBtn.className = 'btn-green'; bleStatusSpan.innerText = '未连接'; connectBtn.disabled = false; }
        }

        async function handleConnectBtn() {
            if (connected) { try { await bleDevice.gatt.disconnect(); } catch(e) {} connected = false; updateConnectionUI(); updateUI({ state: 'IDLE' }); return; }
            try {
                bleStatusSpan.innerText = '搜索中...';
                bleDevice = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
                bleServer = await bleDevice.gatt.connect();
                const service = await bleServer.getPrimaryService(SERVICE_UUID);
                humCharacteristic = await service.getCharacteristic(CHAR_HUMIDITY_UUID);
                cmdCharacteristic = await service.getCharacteristic(CHAR_COMMAND_UUID);
                await humCharacteristic.startNotifications();
                humCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = new TextDecoder().decode(event.target.value);
                    try {
                        const data = JSON.parse(value);
                        document.getElementById('humDisplay').innerText = data.humidity.toFixed(1) + '%';
                        updateUI(data);
                    } catch(e) { console.log('数据解析错误', e); }
                });
                bleDevice.addEventListener('gattserverdisconnected', () => { connected = false; updateConnectionUI(); updateUI({ state: 'IDLE' }); });
                connected = true; updateConnectionUI();
            } catch(error) { bleStatusSpan.innerText = '连接失败'; alert('连接失败，请重试。'); }
        }

        function updateUI(data) {
            const pumpBtn = document.getElementById('pumpBtn'), stopBtn = document.getElementById('stopBtn'), statusDiv = document.getElementById('pumpStatus');
            if (data.state === 'RUNNING') { pumpBtn.innerText = '⏸ 暂停'; pumpBtn.className = 'btn-orange'; stopBtn.style.display = 'block'; statusDiv.innerText = '运行中'; }
            else if (data.state === 'PAUSED') { pumpBtn.innerText = '▶ 继续'; pumpBtn.className = 'btn-blue'; stopBtn.style.display = 'block'; statusDiv.innerText = '已暂停'; }
            else { pumpBtn.innerText = '💧 开始浇水'; pumpBtn.className = 'btn-blue'; stopBtn.style.display = 'none'; statusDiv.innerText = '水泵已停止'; }
        }

        function sendCommand(cmd) { if (!cmdCharacteristic) { alert('请先连接设备！'); return; } cmdCharacteristic.writeValue(new TextEncoder().encode(cmd)); }
        function togglePump() { /* 保持不变 */ }
        function stopPump() { /* 保持不变 */ }
        function toggleInputs() { /* 保持不变 */ }
        function setTarget() { const time = document.getElementById('targetTime').value; if (time) { sendCommand('SETTARGET:' + time); localStorage.setItem('wateringTargetTime', time); document.getElementById('targetTime').value = time; alert('目标时刻已设置为 ' + time); } }

        // ---- 修复后的退出函数 (超时强制恢复) ----
        function requestExit() {
            if (!cmdCharacteristic) { alert('请先连接设备'); return; }
            if (confirm('确定退出配网？将自动同步时间并关闭蓝牙。')) {
                const now = Math.floor(Date.now() / 1000);
                sendCommand('SETTIME:' + now);
                setTimeout(() => sendCommand('EXIT'), 200);
                bleStatusSpan.innerText = '正在退出...';
                connectBtn.disabled = true;
                // 5秒后强制恢复（即使未收到断开事件）
                setTimeout(() => {
                    if (bleStatusSpan.innerText === '正在退出...') {
                        connected = false;
                        updateConnectionUI();
                        updateUI({ state: 'IDLE' });
                    }
                }, 5000);
            }
        }
        updateConnectionUI();
    </script>
</body>
</html>
