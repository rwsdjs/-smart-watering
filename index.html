<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智能浇水系统 - 调试版</title>
    <style>
        body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:16px;}
        .container{max-width:400px;margin:0 auto;background:white;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
        h2{color:#2e7d32;margin:0 0 8px;font-size:22px;}
        .hum-value{font-size:56px;font-weight:bold;color:#333;margin:10px 0;}
        button{border:none;padding:12px;border-radius:8px;font-size:16px;margin:6px 0;width:100%;font-weight:bold;}
        .btn-green{background:#2e7d32;color:white;}
        .btn-red{background:#c62828;color:white;}
        .log-box{background:#000;color:#0f0;font-family:monospace;padding:10px;font-size:12px;height:200px;overflow-y:auto;margin-top:10px;}
    </style>
</head>
<body>
    <div class="container">
        <h2>🌱 智能浇水 (调试版)</h2>
        <div class="hum-value" id="humDisplay">--</div>
        <button id="connectBtn" class="btn-green" onclick="handleConnectBtn()">📶 连接设备</button>
        <div class="log-box" id="logBox"></div>
    </div>
    <script>
        const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const CHAR_HUMIDITY_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
        const CHAR_COMMAND_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a9';
        
        let bleDevice = null;
        let bleServer = null;
        let humCharacteristic = null;
        let connected = false;

        function log(msg) {
            const box = document.getElementById('logBox');
            box.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
            box.scrollTop = box.scrollHeight;
            console.log(msg);
        }

        function updateConnectionUI() {
            const btn = document.getElementById('connectBtn');
            if (connected) {
                btn.innerText = '🔌 断开连接';
                btn.className = 'btn-red';
            } else {
                btn.innerText = '📶 连接设备';
                btn.className = 'btn-green';
            }
        }

        async function handleConnectBtn() {
            if (connected) {
                try {
                    if (bleDevice && bleDevice.gatt.connected) {
                        await bleDevice.gatt.disconnect();
                    }
                } catch(e) {}
                connected = false;
                updateConnectionUI();
                return;
            }

            try {
                log("1. 开始搜索设备...");
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });
                log("2. 找到设备: " + bleDevice.name);

                log("3. 正在建立GATT连接...");
                bleServer = await bleDevice.gatt.connect();
                log("4. GATT连接成功！");

                log("5. 正在获取服务...");
                const service = await bleServer.getPrimaryService(SERVICE_UUID);
                log("6. 服务获取成功！");

                log("7. 正在获取湿度特征值...");
                humCharacteristic = await service.getCharacteristic(CHAR_HUMIDITY_UUID);
                log("8. 湿度特征值获取成功！");

                log("9. 正在订阅通知...");
                await humCharacteristic.startNotifications();
                humCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = new TextDecoder().decode(event.target.value);
                    log("收到数据: " + value);
                    try {
                        const data = JSON.parse(value);
                        document.getElementById('humDisplay').innerText = data.humidity.toFixed(1) + '%';
                    } catch(e) {
                        log("数据解析失败: " + e);
                    }
                });
                log("10. 通知订阅成功！");

                log("✅ 全部完成！连接成功！");
                
                bleDevice.addEventListener('gattserverdisconnected', () => {
                    log("⚠️ 设备断开连接");
                    connected = false;
                    updateConnectionUI();
                });

                connected = true;
                updateConnectionUI();
            } catch(error) {
                log("❌ 错误: " + error);
                console.error(error);
                alert("连接出错，请查看黑色日志框里的具体信息");
            }
        }

        updateConnectionUI();
        log("页面加载完成，请点击连接按钮");
    </script>
</body>
</html>
